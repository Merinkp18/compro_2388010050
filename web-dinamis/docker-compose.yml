# Layanan Database

services:

  db-webdinamis:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: password!123
      MARIADB_DATABASE: dbcompro
      MARIADB_USER: usercompro_2388010050
      MARIADB_PASSWORD: 12345
    volumes:
    - db_data:/var/lib/mysql
    - ./db_data/dbcompro.sql:/docker-entrypoint-initdb.d/dbcompro.sql:ro
    restart: always
    
  container-statis:
    image: merinkharista/compro_2388010050:latest
    ports:
      - "80:80"
    restart: always

  container-dinamis:
    image: merinkharista/web-dinamis:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      DB_USER: usercompro_2388010050
      DB_PASSWORD: 12345
      DB_NAME: dbcompro
      DB_HOST: db-webdinamis
      NEXTAUTH_SECRET: Sganti-dengan-string-acak-panjang-minimal-32-karakter
      NEXTAUTH_URL: http://13.210.225.46:3000//
    depends_on:
      - db-webdinamis

volumes:
  db_data: {}
  